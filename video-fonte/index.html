.hand{font:700 54px/1 Caveat,cursive;color:var(--ink);white-space:nowrap}
.q{font:700 30px/1 Atkinson,sans-serif;color:#fff;background:var(--slate);padding:12px 18px;border-radius:999px;white-space:nowrap}
